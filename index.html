<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Clone (No Credit Card)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { 
            height: 450px; 
            width: 100%; 
            border-radius: 8px;
            margin-top: 10px;
        }
        .form-group { margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>Select Location</h2>

    <!-- Interactive Map Container -->
    <div id="map"></div>

    <!-- Form to send coordinates to your PHP backend -->
    <form action="save_location.php" method="POST">
        <div class="form-group">
            <label>Latitude:</label>
            <input type="text" id="lat" name="latitude" readonly required>
        </div>
        <div class="form-group">
            <label>Longitude:</label>
            <input type="text" id="lng" name="longitude" readonly required>
        </div>
        <button type="submit" style="margin-top: 15px;">Save Location</button>
    </form>

    <!-- Leaflet JavaScript Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Set default fallback coordinates (used if the user denies location access)
    let initialLat = 6.5244;  // Example fallback (Lagos)
    let initialLng = 3.3792;

    // 2. Initialize the Leaflet Map
    const map = L.map('map').setView([initialLat, initialLng], 13);

    // 3. Load Google Maps direct tile layer
    L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '© Google Maps'
    }).addTo(map);

    // 4. Create the marker
    let marker = L.marker([initialLat, initialLng], { draggable: true }).addTo(map);

    function updateForm(lat, lng) {
        document.getElementById('lat').value = lat.toFixed(6);
        document.getElementById('lng').value = lng.toFixed(6);
    }

    updateForm(initialLat, initialLng);

    // 5. Detect User's Real-Time Location automatically
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                // Move map center and marker to the user's real location
                map.setView([userLat, userLng], 15);
                marker.setLatLng([userLat, userLng]);
                updateForm(userLat, userLng);
            },
            (error) => {
                console.warn("Location permission denied or unavailable. Using default coordinates.");
            }
        );
    }

    // Event: Update form when user drags the pin
    marker.on('dragend', function () {
        const position = marker.getLatLng();
        updateForm(position.lat, position.lng);
    });

    // Event: Move pin when user clicks anywhere on the map
    map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        updateForm(e.latlng.lat, e.latlng.lng);
    });
</script>
</body>
</html>
